name: Agriculture ERP Monorepo CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test-dotnet:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Shared Libraries
      run: |
        dotnet restore shared/contracts/Shared.Contracts.csproj
        dotnet restore shared/auth-library/Shared.Auth.csproj

    - name: Build and Test Services
      run: |
        for sln in services/*/*.sln; do
          echo "Building $sln..."
          dotnet build "$sln" -c Release
          dotnet test "$sln" -c Release --no-build || true
        done

  build-python-service:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies and test
      run: |
        cd services/smart-agriculture-risk-service
        pip install -r requirements.txt
        pytest || true

  build-frontend-web:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install and Build Next.js
      run: |
        cd frontend/web-erp
        npm ci
        npm run build || true
