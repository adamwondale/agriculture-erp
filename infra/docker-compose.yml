version: '3.8'

networks:
  agri-network:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:

services:
  # ---------------------------------------------------------------------------
  # Shared Infrastructure
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: agri-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init-scripts:/docker-entrypoint-initdb.d
    networks:
      - agri-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: agri-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - agri-network

  # ---------------------------------------------------------------------------
  # API Gateway
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: ../
      dockerfile: gateway/api-gateway/Dockerfile
    container_name: agri-api-gateway
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - agri-network

  # ---------------------------------------------------------------------------
  # Frontend Web ERP (Next.js 14)
  # ---------------------------------------------------------------------------
  web-erp:
    build:
      context: ../frontend/web-erp
      dockerfile: Dockerfile
    container_name: agri-web-erp
    restart: on-failure
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_GATEWAY_URL=http://localhost:8080
    networks:
      - agri-network

  # ---------------------------------------------------------------------------
  # Python AI/ML Service
  # ---------------------------------------------------------------------------
  smart-agriculture-risk-service:
    build:
      context: ../services/smart-agriculture-risk-service
      dockerfile: Dockerfile
    container_name: agri-smart-agriculture-risk-service
    ports:
      - "5013:5013"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/agri_smart_agriculture_risk_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - agri-network

  core-admin-service:
    build:
      context: ../
      dockerfile: services/core-admin-service/Dockerfile
    container_name: agri-core-admin-service
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=agri_core_admin_db;Username=postgres;Password=postgres
      - RabbitMQ__HostName=rabbitmq
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - agri-network

  master-data-service:
