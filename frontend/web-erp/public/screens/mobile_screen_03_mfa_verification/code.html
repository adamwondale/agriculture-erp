<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Z•ORISIS — Mobile Multi-Factor Authentication</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../design-tokens.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'canvas-warm': '#F7F4EC',
            'surface-white': '#FFFFFF',
            'primary': '#00261B',
            'primary-dark': '#062A20',
            'primary-container': '#0B3D2E',
            'secondary': '#146B45',
            'secondary-container': '#A3F4C3',
            'surface-tint': '#E8F1EA',
            'text-primary': '#17231D',
            'text-muted': '#66736C',
            'border-light': '#DDE4DE',
            'warning-amber': '#D79A19',
            'warning-light': '#FFF3D6'
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    body {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }
    .otp-box {
      width: 46px;
      height: 54px;
      font-size: 22px;
      font-weight: 600;
      text-align: center;
      transition: all 160ms cubic-bezier(0.23, 1, 0.32, 1);
    }
    .otp-box:focus {
      border-color: #146B45;
      background-color: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(20, 107, 69, 0.15);
      outline: none;
      transform: scale(1.04);
    }
  </style>
</head>
<body class="bg-canvas-warm font-sans text-text-primary antialiased min-h-screen flex flex-col justify-between p-5 select-none">

  <!-- Mobile Top Bar with Back Button -->
  <header class="w-full flex items-center justify-between pt-2 pb-4">
    <a href="../mobile_screen_02_login/code.html" class="w-10 h-10 rounded-xl bg-surface-white border border-border-light flex items-center justify-center text-text-muted hover:text-primary active:scale-95 transition-transform shadow-subtle">
      <span class="material-symbols-outlined text-[20px]">arrow_back</span>
    </a>
    <div class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-white border border-border-light text-[11px] text-text-muted shadow-subtle">
      <span class="material-symbols-outlined text-[14px] text-secondary">security</span>
      <span>Step 2 of 2</span>
    </div>
    <div class="w-10"></div>
  </header>

  <!-- Main Card -->
  <main class="w-full max-w-sm mx-auto my-auto py-2 flex flex-col items-center text-center">
    <!-- Security Shield Node -->
    <div class="w-14 h-14 rounded-2xl bg-surface-tint text-secondary flex items-center justify-center mb-5 shadow-subtle border border-secondary/20">
      <span class="material-symbols-outlined text-[28px]">verified_user</span>
    </div>

    <h1 class="text-2xl font-bold tracking-tight text-primary mb-2" style="letter-spacing: -0.02em;">
      Verify Your Identity
    </h1>
    <p class="text-sm text-text-muted leading-relaxed mb-8 max-w-[280px]">
      Enter the 6-digit authentication token sent to your registered device ending in <span class="font-semibold text-primary font-mono">•7829</span>.
    </p>

    <!-- 6-Box OTP Input -->
    <form id="otp-form" class="w-full" onsubmit="event.preventDefault(); handleMfaSubmit();">
      <div class="flex justify-center items-center gap-2 sm:gap-2.5 mb-6">
        <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" class="otp-box bg-surface-white border border-border-light rounded-xl text-primary" autofocus id="otp-1" value="7">
        <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" class="otp-box bg-surface-white border border-border-light rounded-xl text-primary" id="otp-2" value="4">
        <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" class="otp-box bg-surface-white border border-border-light rounded-xl text-primary" id="otp-3" value="1">
        <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" class="otp-box bg-surface-white border border-border-light rounded-xl text-primary" id="otp-4" value="9">
        <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" class="otp-box bg-surface-white border border-border-light rounded-xl text-primary" id="otp-5" value="2">
        <input type="text" maxlength="1" pattern="[0-9]*" inputmode="numeric" class="otp-box bg-surface-white border border-border-light rounded-xl text-primary" id="otp-6" placeholder="•">
      </div>

      <!-- Countdown Resend Timer Pill -->
      <div class="flex items-center justify-center gap-2 mb-8">
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-warning-light text-warning-amber text-xs font-medium border border-warning-amber/20">
          <span class="material-symbols-outlined text-[14px]">timer</span>
          <span>Resend code in <span id="countdown" class="font-mono font-semibold">00:28</span></span>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="space-y-3 w-full">
        <button 
          type="submit" 
          id="verify-btn"
          class="w-full h-12 bg-primary-container text-white font-semibold text-sm rounded-xl shadow-card flex items-center justify-center gap-2 transition-all active:scale-[0.97] hover:bg-primary-dark"
        >
          <span>Verify &amp; Continue</span>
          <span class="material-symbols-outlined text-[18px]">check_circle</span>
        </button>

        <button 
          type="button" 
          onclick="useBackupCode()"
          class="w-full h-11 bg-surface-white border border-border-light text-text-muted hover:text-primary font-medium text-xs rounded-xl flex items-center justify-center gap-1.5 shadow-subtle active:scale-[0.97] transition-all"
        >
          <span class="material-symbols-outlined text-[16px]">key</span>
          <span>Use backup verification code</span>
        </button>
      </div>
    </form>
  </main>

  <!-- Security Audit Guarantee -->
  <footer class="w-full text-center py-2">
    <span class="text-[11px] text-text-muted/80">
      Biometrically anchored session token • ISO 27001
    </span>
  </footer>

  <script>
    // Auto-advance OTP box cursor
    const inputs = document.querySelectorAll('.otp-box');
    inputs.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        if (e.target.value.length === 1 && index < inputs.length - 1) {
          inputs[index + 1].focus();
        }
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          inputs[index - 1].focus();
        }
      });
    });

    // Simulated Countdown
    let seconds = 28;
    const timerElem = document.getElementById('countdown');
    const timerInterval = setInterval(() => {
      seconds--;
      if (seconds >= 0) {
        timerElem.textContent = `00:${seconds < 10 ? '0' : ''}${seconds}`;
      } else {
        clearInterval(timerInterval);
        timerElem.parentElement.innerHTML = `<button type="button" onclick="location.reload()" class="text-secondary font-semibold hover:underline">Resend code now</button>`;
      }
    }, 1000);

    function handleMfaSubmit() {
      const btn = document.getElementById('verify-btn');
      btn.disabled = true;
      btn.innerHTML = `<div class="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin" style="animation-duration: 0.6s;"></div><span>Authorizing credentials...</span>`;
      setTimeout(() => {
        btn.innerHTML = `<span class="material-symbols-outlined text-[18px]">verified</span><span>Authentication Verified</span>`;
        setTimeout(() => {
          window.location.href = '../mobile_screen_04_home_role_context/code.html';
        }, 500);
      }, 1000);
    }

    function useBackupCode() {
      alert("Alternative MFA: An offline hardware SMS key code prompt has been triggered.");
    }
  </script>
</body>
</html>
