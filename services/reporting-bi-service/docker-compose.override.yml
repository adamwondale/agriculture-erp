version: '3.8'

services:
  reporting-bi-service:
    build:
      context: ../../
      dockerfile: services/reporting-bi-service/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=agri_reporting_bi_db;Username=postgres;Password=postgres
      - RabbitMQ__HostName=rabbitmq
    ports:
      - "5014:8080"
