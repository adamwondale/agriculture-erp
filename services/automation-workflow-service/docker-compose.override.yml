version: '3.8'

services:
  automation-workflow-service:
    build:
      context: ../../
      dockerfile: services/automation-workflow-service/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=agri_automation_workflow_db;Username=postgres;Password=postgres
      - RabbitMQ__HostName=rabbitmq
    ports:
      - "5015:8080"
