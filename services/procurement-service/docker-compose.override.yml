version: '3.8'

services:
  procurement-service:
    build:
      context: ../../
      dockerfile: services/procurement-service/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=agri_procurement_db;Username=postgres;Password=postgres
      - RabbitMQ__HostName=rabbitmq
    ports:
      - "5007:8080"
