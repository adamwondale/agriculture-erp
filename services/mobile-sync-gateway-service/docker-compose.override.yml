version: '3.8'

services:
  mobile-sync-gateway-service:
    build:
      context: ../../
      dockerfile: services/mobile-sync-gateway-service/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=agri_mobile_sync_gateway_db;Username=postgres;Password=postgres
      - RabbitMQ__HostName=rabbitmq
    ports:
      - "5012:8080"
