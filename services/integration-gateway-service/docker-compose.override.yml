version: '3.8'

services:
  integration-gateway-service:
    build:
      context: ../../
      dockerfile: services/integration-gateway-service/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=agri_integration_gateway_db;Username=postgres;Password=postgres
      - RabbitMQ__HostName=rabbitmq
    ports:
      - "5016:8080"
